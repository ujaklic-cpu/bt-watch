name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure DNS for dl.google.com
        run: |
          # Get IP address for maven.google.com and use it for dl.google.com
          DL_GOOGLE_IP=$(dig +short maven.google.com | head -n1)
          echo "$DL_GOOGLE_IP dl.google.com" | sudo tee -a /etc/hosts

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0 platform-tools

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
